{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Budget · SpendWise</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo">Spend<span>Wise</span></div>
    <nav class="nav-links">
      <a href="/">Dashboard</a>
      <a href="/expenses/">Expenses</a>
      <a href="/income/">Income</a>
      <a href="/budget/" class="active">Budgets</a>
      <a href="/categories/">Categories</a>
      <a href="/reports/">Reports</a>
    </nav>
    <div class="sidebar-user">
      <strong>Demo User</strong>
      <a href="/login/">Sign out</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Set Budget</h1>
        <p>Define a spending limit for a category</p>
      </div>
    </div>
    <div class="panel form-card">
      <form action="/budget/" method="get">
        <div class="form-group">
          <label for="category">Category</label>
          <select class="form-control" id="category">
            <option>Food & Dining</option>
            <option>Transport</option>
            <option>Housing</option>
            <option>Shopping</option>
            <option>Entertainment</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amount">Amount</label>
          <input class="form-control" type="number" id="amount" step="0.01" min="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label for="period">Period</label>
          <select class="form-control" id="period">
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="form-group">
          <label for="year">Year</label>
          <input class="form-control" type="number" id="year" value="2026">
        </div>
        <div class="form-group" id="month-group">
          <label for="month">Month</label>
          <input class="form-control" type="number" id="month" min="1" max="12" value="8">
        </div>
        <div class="form-group">
          <label for="alert">Alert threshold (%)</label>
          <input class="form-control" type="number" id="alert" min="1" max="100" value="80">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="/budget/" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>
<button class="mobile-toggle" id="menuToggle">☰</button>
<script>
document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
const period = document.getElementById('period');
const monthGroup = document.getElementById('month-group');
period.onchange = () => { monthGroup.style.display = period.value === 'monthly' ? 'block' : 'none'; };
</script>
</body>
</html>
