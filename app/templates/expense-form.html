{% extends "base.html" %}
{% block title %}Add Expense · SpendWise{% endblock %}

{% block content %}
    <div class="page-header">
      <div>
        <h1>Add Expense</h1>
        <p>Record a spending transaction</p>
      </div>
    </div>
    <div class="panel form-card">
      <form action="/expenses/" method="get">
        <div class="form-group">
          <label for="title">Title</label>
          <input class="form-control" type="text" id="title" placeholder="What did you spend on?">
        </div>
        <div class="form-group">
          <label for="amount">Amount</label>
          <input class="form-control" type="number" id="amount" step="0.01" min="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select class="form-control" id="category">
            <option>Food & Dining</option>
            <option>Transport</option>
            <option>Housing</option>
            <option>Healthcare</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>Bills & Utilities</option>
            <option>Education</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date">Date</label>
          <input class="form-control" type="date" id="date" value="2026-08-11">
        </div>
        <div class="form-group">
          <label for="payment">Payment method</label>
          <select class="form-control" id="payment">
            <option>UPI</option>
            <option>Cash</option>
            <option>Card</option>
            <option>Bank Transfer</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea class="form-control" id="notes" rows="3" placeholder="Optional notes"></textarea>
        </div>
        <div class="form-group">
          <label for="receipt">Receipt</label>
          <input class="form-control" type="file" id="receipt">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="/expenses/" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
{% endblock %}
