{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Finch{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">
  <link rel="icon" href="{% static 'img/Finch_icon.png' %}" type="image/png">

  {% block extra_head %}{% endblock %}
</head>

<body>

<div class="auth-page">

  <main class="auth-card">

    <a class="auth-brand">
      <span class="auth-brand-mark"></span>
      <span>
        <strong>Finch</strong>
        <small>Small decisions, smarter finances.</small>
      </span>
    </a>

    {% block content %}{% endblock %}

  </main>

</div>

{% block extra_scripts %}{% endblock %}

</body>
</html>
