<!-- templates/ai_chatbox.html - Debug Version -->
<div id="ai-chatbox">
    <!-- Toggle Button -->
    <button id="chat-toggle" style="position:fixed;bottom:30px;right:30px;background:#0F766E;color:white;border:none;padding:15px 25px;border-radius:50px;font-size:16px;cursor:pointer;z-index:9999;font-weight:bold;box-shadow:0 4px 15px rgba(15,118,110,0.4);">
        💬 Ask AI
    </button>

    <!-- Chat Panel -->
    <div id="chat-panel" style="display:none;position:fixed;bottom:80px;right:30px;width:380px;height:500px;background:white;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2);z-index:9999;display:none;flex-direction:column;overflow:hidden;max-width:90vw;max-height:70vh;">
        
        <!-- Header -->
        <div style="background:#0F766E;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
            <h3 style="margin:0;font-size:16px;">🤖 Financial Assistant</h3>
            <button id="chat-close" style="background:transparent;border:none;color:white;font-size:20px;cursor:pointer;">✕</button>
        </div>
        
        <!-- Messages -->
        <div id="chat-messages" style="flex:1;padding:15px 20px;overflow-y:auto;background:#f8fafc;display:flex;flex-direction:column;gap:10px;">
            <div style="background:white;padding:12px 16px;border-radius:12px;border-bottom-left-radius:4px;max-width:80%;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                👋 Hi! I'm your financial assistant. Ask me anything!
                <br><br>
                <small style="color:#64748b;">Example: "How much did I spend last month?"</small>
            </div>
        </div>
        
        <!-- Input -->
        <div style="padding:12px 15px;background:white;border-top:1px solid #e2e8f0;display:flex;gap:10px;flex-shrink:0;">
            <input type="text" id="chat-input" placeholder="Ask a question..." style="flex:1;padding:10px 15px;border:2px solid #e2e8f0;border-radius:25px;font-size:14px;outline:none;">
            <button id="chat-send" style="background:#0F766E;color:white;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;">➤</button>
        </div>
        
        <!-- Debug Log -->
        <div id="debug-log" style="padding:10px;background:#1a1a2e;color:#4fc3f7;font-size:12px;font-family:monospace;max-height:80px;overflow-y:auto;display:none;border-top:2px solid #0F766E;"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Get elements
    const toggle = document.getElementById('chat-toggle');
    const panel = document.getElementById('chat-panel');
    const close = document.getElementById('chat-close');
    const input = document.getElementById('chat-input');
    const send = document.getElementById('chat-send');
    const messages = document.getElementById('chat-messages');
    const debugLog = document.getElementById('debug-log');
    
    let isProcessing = false;
    
    // Debug function
    function debug(msg) {
        console.log('🔍 [Debug]', msg);
        debugLog.style.display = 'block';
        debugLog.innerHTML += `<div>${msg}</div>`;
        debugLog.scrollTop = debugLog.scrollHeight;
    }
    
    // Toggle chat
    toggle.onclick = function() {
        if (panel.style.display === 'none') {
            panel.style.display = 'flex';
            debugLog.style.display = 'none'; // Hide debug initially
            input.focus();
            debug('Chat opened');
        } else {
            panel.style.display = 'none';
            debug('Chat closed');
        }
    };
    
    close.onclick = function() {
        panel.style.display = 'none';
        debug('Chat closed');
    };
    
    // Add message function
    function addMessage(text, type) {
        const div = document.createElement('div');
        div.style.background = type === 'user' ? '#0F766E' : 'white';
        div.style.color = type === 'user' ? 'white' : '#1a1a2e';
        div.style.padding = '12px 16px';
        div.style.borderRadius = '12px';
        div.style.borderBottomRightRadius = type === 'user' ? '4px' : '12px';
        div.style.borderBottomLeftRadius = type === 'bot' ? '4px' : '12px';
        div.style.maxWidth = '80%';
        div.style.alignSelf = type === 'user' ? 'flex-end' : 'flex-start';
        div.style.boxShadow = type === 'bot' ? '0 2px 8px rgba(0,0,0,0.08)' : 'none';
        div.style.wordWrap = 'break-word';
        div.style.whiteSpace = 'pre-wrap';
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        debug(`Added ${type} message: ${text.substring(0, 50)}...`);
    }
    
    // Send message
    function sendMessage() {
        const question = input.value.trim();
        if (!question || isProcessing) {
            debug('Send blocked: empty or processing');
            return;
        }
        
        debug(`Sending question: "${question}"`);
        addMessage(question, 'user');
        input.value = '';
        input.disabled = true;
        send.disabled = true;
        isProcessing = true;
        
        // Show typing indicator
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typing';
        typingDiv.style.cssText = 'background:white;padding:12px 20px;border-radius:12px;align-self:flex-start;box-shadow:0 2px 8px rgba(0,0,0,0.08);';
        typingDiv.innerHTML = '⏳ Thinking...';
        messages.appendChild(typingDiv);
        messages.scrollTop = messages.scrollHeight;
        debug('Typing indicator shown');
        
        // Send to server
        const url = `/ai-query/?q=${encodeURIComponent(question)}`;
        debug(`Fetching: ${url}`);
        
        fetch(url)
            .then(response => {
                debug(`Response status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                debug(`Response data: ${JSON.stringify(data).substring(0, 200)}...`);
                if (data.task_id) {
                    debug(`Got task ID: ${data.task_id}`);
                    pollResult(data.task_id);
                } else {
                    throw new Error('No task ID received');
                }
            })
            .catch(error => {
                debug(`ERROR: ${error.message}`);
                document.getElementById('typing')?.remove();
                addMessage(`❌ Error: ${error.message}`, 'bot');
                isProcessing = false;
                input.disabled = false;
                send.disabled = false;
                input.focus();
            });
    }
    
    // Poll for result
    function pollResult(taskId) {
        debug(`Polling task: ${taskId}`);
        const url = `/ai-result/${taskId}/`;
        debug(`Polling URL: ${url}`);
        
        fetch(url)
            .then(response => {
                debug(`Poll status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                debug(`Poll data: ${JSON.stringify(data).substring(0, 200)}...`);
                
                if (data.status === 'completed') {
                    document.getElementById('typing')?.remove();
                    const answer = data.result?.answer || 'No answer available';
                    debug(`Got answer: ${answer.substring(0, 100)}...`);
                    addMessage(answer, 'bot');
                    
                    // Show stats if available
                    if (data.result?.data_summary) {
                        const stats = data.result.data_summary;
                        const statsText = `📊 Stats: $${stats.total_expenses} expenses | ${stats.expense_count} transactions`;
                        const div = document.createElement('div');
                        div.style.cssText = 'background:#f1f5f9;padding:10px 14px;border-radius:12px;align-self:flex-start;font-size:12px;color:#475569;';
                        div.textContent = statsText;
                        messages.appendChild(div);
                        messages.scrollTop = messages.scrollHeight;
                        debug('Stats added');
                    }
                    
                    isProcessing = false;
                    input.disabled = false;
                    send.disabled = false;
                    input.focus();
                    debug('Ready for next question');
                    
                } else if (data.status === 'processing') {
                    debug('Still processing, polling again in 2s...');
                    setTimeout(() => pollResult(taskId), 2000);
                } else {
                    document.getElementById('typing')?.remove();
                    addMessage(`❌ Error: ${data.error || 'Unknown error'}`, 'bot');
                    isProcessing = false;
                    input.disabled = false;
                    send.disabled = false;
                    debug(`Error state: ${JSON.stringify(data)}`);
                }
            })
            .catch(error => {
                debug(`Poll ERROR: ${error.message}`);
                document.getElementById('typing')?.remove();
                addMessage(`❌ Connection error: ${error.message}`, 'bot');
                isProcessing = false;
                input.disabled = false;
                send.disabled = false;
            });
    }
    
    // Event listeners
    send.onclick = sendMessage;
    input.onkeydown = function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    };
    
    debug('Chatbox initialized ✅');
});
</script>
